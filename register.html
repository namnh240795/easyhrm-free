<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Face - Face Recognition System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="workstation.html">Workstation</a>
            <a href="register.html" class="active">Register</a>
            <a href="validate.html">Validate</a>
        </nav>

        <header class="header">
            <h1>Register Your Face</h1>
            <p class="subtitle">Capture your face descriptor for future recognition</p>
        </header>

        <div id="status" class="status loading">
            <span class="status-dot"></span>
            <span id="status-text">Loading face detection models...</span>
        </div>

        <div class="video-container">
            <div class="video-wrapper">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="name-input" placeholder="Enter your name" disabled>
            <button id="register-btn" class="btn btn-primary" disabled>Register Face</button>
        </div>

        <div class="results-panel">
            <h3>Registered Faces (<span id="face-count">0</span>)</h3>
            <div id="faces-list"></div>
        </div>

        <footer class="footer">
            <p>Powered by face-api.js | Pure client-side face recognition</p>
        </footer>
    </div>

    <!-- Load face-api.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <script src="js/db.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
