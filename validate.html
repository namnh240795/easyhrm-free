<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validate Face - Face Recognition System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="workstation.html">Workstation</a>
            <a href="register.html">Register</a>
            <a href="validate.html" class="active">Validate</a>
        </nav>

        <header class="header">
            <h1>Validate Your Face</h1>
            <p class="subtitle">Verify if your face matches any registered users</p>
        </header>

        <div id="status" class="status loading">
            <span class="status-dot"></span>
            <span id="status-text">Loading face detection models...</span>
        </div>

        <div class="video-container">
            <div class="video-wrapper">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <div class="controls">
            <button id="validate-btn" class="btn btn-primary" disabled>Capture & Validate</button>
            <button id="auto-validate-btn" class="btn btn-secondary" disabled>Enable Auto-Validate</button>
        </div>

        <div class="results-panel">
            <h3>Validation Results</h3>
            <div id="results-container"></div>
        </div>

        <footer class="footer">
            <p>Powered by face-api.js | Pure client-side face recognition</p>
        </footer>
    </div>

    <!-- Load face-api.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <script src="js/db.js"></script>
    <script src="js/validate.js"></script>
</body>
</html>
